name: Karate Tests + Deploy Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# Verhindert parallele Deployments, die sich gegenseitig ueberschreiben
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # 1. Karate-Tests ausführen (nur wenn ein pom.xml im Repo liegt)
      - name: Run Karate Tests
        if: hashFiles('**/pom.xml') != ''
        run: |
          mvn test \
            -Dtest=TestsRunner \
            -Dkarate.options="--output target/karate-reports --format json"

      # 2. JSON-Dateien ins SPA kopieren (Fallback: vorhanden public/karate-reports)
      - name: Copy Karate Reports to SPA
        run: |
          mkdir -p public/karate-reports
          if compgen -G "target/karate-reports/*.json" > /dev/null; then
            cp -r target/karate-reports/*.json public/karate-reports/
          else
            echo "Keine Karate-Reports gefunden - nutze vorhandene public/karate-reports/"
          fi

      # 3. SPA bauen
      - name: Build SPA
        run: npm install && npm run build

      # 4. Deployen zu GitHub Pages (offizielle Actions; nutzt das gebaute ./dist)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
