name: Karate Tests + Deploy Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# Verhindert parallele Deployments, die sich gegenseitig ueberschreiben
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (für den Karate-Demo-Runner)
        if: hashFiles('karate-demo/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 1. Karate-Tests: Demo-Suite gegen eingebetteten MockServer (offline, grün in CI)
      - name: Run Karate Tests (karate-demo)
        if: hashFiles('karate-demo/pom.xml') != ''
        working-directory: karate-demo
        run: |
          if command -v mvn >/dev/null 2>&1; then
            echo "> nutze installiertes Maven"
            mvn -ntp -B test
          else
            echo "> nutze Maven-Wrapper"
            chmod +x mvnw
            ./mvnw -ntp -B test
          fi

      # Für echte Karate-Projekte (pom.xml am Repo-Root):
      # - name: Run Karate Tests (eigenes Projekt)
      #   run: mvn -ntp -B test -Dtest=TestsRunner

      # 2. Karate-JSON ins Dashboard-Format konvertieren
      #    (rohes Cucumber-JSON wuerde die Tabelle brechen -> Konverter nutzen)
      - name: Convert Karate Reports
        run: |
          if compgen -G "karate-demo/target/karate-reports/cucumber-json/*.json" > /dev/null; then
            node scripts/karate-to-dashboard.mjs karate-demo/target/karate-reports/cucumber-json \
              --id demo-run --label "Demo Runner (Mock-API)" \
              --out public/karate-reports
          elif compgen -G "target/karate-reports/*.json" > /dev/null; then
            node scripts/karate-to-dashboard.mjs target/karate-reports \
              --id karate-latest --label "Letzter Karate-Lauf" \
              --out public/karate-reports
          else
            echo "Keine Karate-Reports gefunden - Dashboard nutzt die vorhandenen Reports"
          fi

      # 3. SPA bauen
      - name: Build SPA
        run: npm install && npm run build

      # 4. Deployen zu GitHub Pages (offizielle Actions; nutzt das gebaute ./dist)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
